<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emotion-Based Songs</title>
    <link rel="stylesheet" href="./camera.css" />
    <script type="module" src="camera.js"></script>
  </head>
  <body>
    <div class="container">
      <!-- Camera Section -->
      <div class="camera-section">
        <h2>Camera</h2>
        <div class="camera-frame">
          <video id="webcam" autoplay playsinline></video>
        </div>
        <!-- Emotion Detection Button -->
        <div class="emotion-detect">
          <button id="detectEmotion">Detect Emotion</button>
        </div>
      </div>

      <!-- Songs Section -->
      <div class="songs-section custom-scrollbar">
        <h2>Emotion-Based Songs</h2>
        <div id="song-list">
          <!-- Songs will be dynamically inserted here -->
        </div>
      </div>
      <!--  -->
    </div>
  </body>
</html>
